<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connections Mobile Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --yellow: #f9df6d;
            --green: #a0c35a;
            --blue: #b0c4ef;
            --purple: #ba81c5;
            --tile-bg: #efefe6;
            --tile-selected: #5a594e;
            --tile-text-selected: #ffffff;
            --text-primary: #1a1a1a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #faf9f6;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: -webkit-fill-available;
        }

        .title-font {
            font-family: 'Frank Ruhl Libre', serif;
        }

        /* Animations */
        @keyframes tilePop {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rowReveal {
            0% { transform: translateY(-8px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .tile-animate {
            animation: tilePop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .row-reveal {
            animation: rowReveal 0.35s ease-out forwards;
        }

        .shake-animation {
            animation: shake 0.35s ease-in-out;
        }

        /* Category Color Themes */
        .bg-cat-yellow { background-color: var(--yellow); color: #2d2800; }
        .bg-cat-green { background-color: var(--green); color: #162900; }
        .bg-cat-blue { background-color: var(--blue); color: #081d42; }
        .bg-cat-purple { background-color: var(--purple); color: #2c0038; }

        /* Responsive Grid & Tile Mobile Safeguards */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .tile-button {
            min-width: 0; /* Prevents overflow/disappearing grid items on Android Chrome */
            width: 100%;
            aspect-ratio: 1 / 0.85; /* Ensures healthy aspect ratio on mobile portrait */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.25rem;
            border-radius: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            line-height: 1.1;
            /* Fluid fluid typography scaling */
            font-size: clamp(0.7rem, 2.8vw, 1rem);
            user-select: none;
            touch-action: manipulation;
        }

        /* Accordion Chevron Rotation */
        details summary::-webkit-details-marker { display: none; }
        details summary svg.chevron { transition: transform 0.2s ease; }
        details[open] summary svg.chevron { transform: rotate(180deg); }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-3 sm:p-6">

    <div class="w-full max-w-lg mx-auto flex flex-col items-center my-auto">
        
        <!-- Header -->
        <header class="text-center my-3 sm:my-5">
            <h1 class="title-font text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 mb-1">Connections</h1>
            <p id="sub-title" class="text-xs sm:text-sm font-medium text-gray-600">Create four groups of four!</p>
        </header>

        <!-- Feedback Toast Notification -->
        <div id="toast-container" class="h-8 sm:h-10 mb-3 flex items-center justify-center">
            <div id="toast" class="hidden px-4 py-1.5 sm:py-2 bg-gray-900 text-white text-xs sm:text-sm font-semibold rounded-full shadow-md transition-all duration-300">
                Feedback
            </div>
        </div>

        <!-- Solved Category Rows -->
        <div id="solved-container" class="w-full space-y-2 mb-2"></div>

        <!-- Interactive Grid (Safeguarded for Mobile Chrome) -->
        <div id="grid-container" class="mb-5">
            <!-- Tiles rendered dynamically -->
        </div>

        <!-- Remaining Mistakes Counter -->
        <div id="mistakes-container" class="flex items-center justify-center space-x-2 mb-5">
            <span class="text-xs sm:text-sm font-medium text-gray-500">Mistakes remaining:</span>
            <div id="mistakes-dots" class="flex space-x-1.5"></div>
        </div>

        <!-- Controls -->
        <div id="controls" class="flex flex-wrap items-center justify-center gap-2 mb-6 w-full">
            <button id="btn-shuffle" type="button" class="px-4 py-2.5 rounded-full border border-gray-900 text-gray-900 font-semibold text-xs sm:text-sm hover:bg-gray-100 active:scale-95 transition-all">
                Shuffle!
            </button>
            <button id="btn-deselect" type="button" class="px-4 py-2.5 rounded-full border border-gray-900 text-gray-900 font-semibold text-xs sm:text-sm hover:bg-gray-100 active:scale-95 transition-all">
                Deselect All
            </button>
            <button id="btn-submit" type="button" disabled class="px-6 py-2.5 rounded-full border border-gray-900 bg-gray-900 text-white font-semibold text-xs sm:text-sm disabled:opacity-30 disabled:cursor-not-allowed hover:bg-black active:scale-95 transition-all">
                Submit
            </button>
            <button id="btn-restart" type="button" class="hidden px-6 py-2.5 rounded-full bg-black text-white font-semibold text-xs sm:text-sm hover:bg-gray-800 active:scale-95 transition-all">
                Play Again
            </button>
        </div>

        <!-- Collapsible Guess History -->
        <details id="history-details" class="w-full border border-gray-200 rounded-2xl bg-white shadow-sm overflow-hidden transition-all duration-200">
            <summary class="flex items-center justify-between p-3.5 sm:p-4 cursor-pointer hover:bg-gray-50 list-none font-semibold text-xs sm:text-sm text-gray-700">
                <span class="flex items-center gap-2">
                    <span id="history-header-title">▼ Guess History</span>
                    <span id="history-badge" class="bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded-full">0</span>
                </span>
                <svg class="chevron w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </summary>
            
            <div class="px-3 pb-3 pt-1 sm:px-4 sm:pb-4 border-t border-gray-100 space-y-2 max-h-56 overflow-y-auto" id="history-log">
                <p id="history-empty" class="text-xs text-gray-400 italic text-center py-2">No guesses submitted yet.</p>
            </div>
        </details>

    </div>

    <!-- Footer -->
    <footer class="mt-6 text-center text-xs text-gray-400">
        NYT Connections Clone • Responsive Mobile Edition
    </footer>

    <script>
        /**
         * GAME DATA STRUCTURE
         * Edit this array to change topics & words.
         * Difficulty: 0=Yellow, 1=Green, 2=Blue, 3=Purple
         */
const categories = [
        { difficulty: 0, desc: "UNIT OF TIME", items: ["WEEK", "MONTH", "YEAR", "DECADE"] },
        { difficulty: 1, desc: "ORIGINAL STAR TREK CHARACTERS", items: ["SPOCK", "SCOTTY", "UHURA", "SULU"] },
        { difficulty: 2, desc: "FIRST WORD OF DISNEY CLASSICS", items: ["101", "HERBY", "SNOW", "SLEEPING"] },
        { difficulty: 3, desc: "STARTS WITH CRAZY", items: ["LADY", "HAPPY", "DAY", "BONES"] }
    ];

        const DIFFICULTY_CLASSES = [
            'bg-cat-yellow',
            'bg-cat-green',
            'bg-cat-blue',
            'bg-cat-purple'
        ];
        
        const DIFFICULTY_EMOJIS = ['🟨', '🟩', '🟦', '🟪'];

        // Game State Variables
        let activeWords = [];       
        let selectedIndices = [];   
        let solvedCategories = [];  
        let guessHistory = [];      
        let mistakesRemaining = 4;
        let isGameOver = false;
        let toastTimeout = null;

        // DOM Element References
        const gridContainer = document.getElementById('grid-container');
        const solvedContainer = document.getElementById('solved-container');
        const toastEl = document.getElementById('toast');
        const btnSubmit = document.getElementById('btn-submit');
        const btnDeselect = document.getElementById('btn-deselect');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnRestart = document.getElementById('btn-restart');
        const mistakesDots = document.getElementById('mistakes-dots');
        const historyLog = document.getElementById('history-log');
        const historyEmpty = document.getElementById('history-empty');
        const historyBadge = document.getElementById('history-badge');
        const historyDetails = document.getElementById('history-details');

        /**
         * Initializes or resets game state
         */
        function initGame() {
            activeWords = [];
            selectedIndices = [];
            solvedCategories = [];
            guessHistory = [];
            mistakesRemaining = 4;
            isGameOver = false;

            // Load and flatten game words
            GAME_CATEGORIES.forEach((cat, index) => {
                cat.items.forEach(item => {
                    activeWords.push({
                        text: item.toUpperCase(),
                        categoryId: index
                    });
                });
            });

            // Randomize grid
            shuffleArray(activeWords);

            // Clear DOM UI
            solvedContainer.innerHTML = '';
            historyLog.innerHTML = '';
            historyLog.appendChild(historyEmpty);
            historyEmpty.classList.remove('hidden');
            historyBadge.textContent = '0';
            historyDetails.open = false;

            btnSubmit.classList.remove('hidden');
            btnDeselect.classList.remove('hidden');
            btnShuffle.classList.remove('hidden');
            btnRestart.classList.add('hidden');
            btnSubmit.disabled = true;

            updateMistakesUI();
            renderGrid();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /**
         * Renders current tile grid
         */
        function renderGrid() {
            gridContainer.innerHTML = '';

            activeWords.forEach((wordObj, index) => {
                const tile = document.createElement('button');
                tile.type = 'button';
                
                const isSelected = selectedIndices.includes(index);
                
                let tileClasses = "tile-button tile-animate shadow-sm transition-all duration-150 ";
                
                if (isSelected) {
                    tileClasses += "bg-[var(--tile-selected)] text-[var(--tile-text-selected)] scale-[0.97]";
                } else {
                    tileClasses += "bg-[var(--tile-bg)] text-[var(--text-primary)] hover:bg-stone-200 active:scale-95";
                }

                tile.className = tileClasses;
                tile.textContent = wordObj.text;
                tile.onclick = () => handleTileClick(index);

                gridContainer.appendChild(tile);
            });

            btnSubmit.disabled = selectedIndices.length !== 4 || isGameOver;
        }

        function handleTileClick(index) {
            if (isGameOver) return;

            const existingIndex = selectedIndices.indexOf(index);
            if (existingIndex > -1) {
                selectedIndices.splice(existingIndex, 1);
            } else if (selectedIndices.length < 4) {
                selectedIndices.push(index);
            }

            renderGrid();
        }

        /**
         * Validates guess submission
         */
        function handleSubmitGuess() {
            if (selectedIndices.length !== 4 || isGameOver) return;

            const selectedWords = selectedIndices.map(i => activeWords[i].text).sort();
            const guessKey = selectedWords.join('|');

            // Check duplicate guess
            const isDuplicate = guessHistory.some(g => [...g.words].sort().join('|') === guessKey);
            if (isDuplicate) {
                showToast("Already guessed!");
                triggerShakeAnimation();
                return;
            }

            // Categorize selection matches
            const categoryCounts = {};
            selectedIndices.forEach(i => {
                const catId = activeWords[i].categoryId;
                categoryCounts[catId] = (categoryCounts[catId] || 0) + 1;
            });

            const counts = Object.values(categoryCounts);
            const maxMatch = Math.max(...counts);
            const matchingCategoryId = Object.keys(categoryCounts).find(catId => categoryCounts[catId] === 4);

            const guessColors = selectedIndices.map(i => DIFFICULTY_EMOJIS[activeWords[i].categoryId]);

            if (matchingCategoryId !== undefined) {
                handleCorrectGuess(parseInt(matchingCategoryId), selectedWords, guessColors);
            } else {
                handleIncorrectGuess(maxMatch, selectedWords, guessColors);
            }
        }

        function handleCorrectGuess(catId, wordList, emojiColors) {
            solvedCategories.push(catId);
            recordGuessHistory(wordList, emojiColors, "Correct!");

            const solvedCategoryItems = GAME_CATEGORIES[catId].items.map(item => item.toUpperCase());
            activeWords = activeWords.filter(w => !solvedCategoryItems.includes(w.text));
            selectedIndices = [];

            renderSolvedCategoryBanner(catId);
            
            if (solvedCategories.length === 4) {
                isGameOver = true;
                showToast("Great job!");
                setTimeout(triggerVictoryEnd, 500);
            } else {
                showToast("Nice!");
            }

            renderGrid();
        }

        function renderSolvedCategoryBanner(catId) {
            const category = GAME_CATEGORIES[catId];
            const banner = document.createElement('div');
            
            const colorClass = DIFFICULTY_CLASSES[category.difficulty];
            banner.className = `w-full rounded-xl p-3 sm:p-4 text-center ${colorClass} row-reveal shadow-sm flex flex-col justify-center items-center`;
            
            banner.innerHTML = `
                <h2 class="font-extrabold text-xs sm:text-base tracking-wide uppercase mb-0.5">${category.desc}</h2>
                <p class="text-xs sm:text-sm font-medium opacity-90">${category.items.join(', ')}</p>
            `;
            
            solvedContainer.appendChild(banner);
        }

        function handleIncorrectGuess(maxMatch, wordList, emojiColors) {
            mistakesRemaining--;
            updateMistakesUI();

            let feedback = "Nope";
            if (maxMatch === 3) {
                feedback = "One away!";
            }

            showToast(feedback);
            triggerShakeAnimation();
            recordGuessHistory(wordList, emojiColors, feedback);

            if (mistakesRemaining === 0) {
                isGameOver = true;
                setTimeout(triggerDefeatEnd, 700);
            }
        }

        function triggerDefeatEnd() {
            showToast("Next time!");
            
            GAME_CATEGORIES.forEach((cat, index) => {
                if (!solvedCategories.includes(index)) {
                    renderSolvedCategoryBanner(index);
                }
            });

            activeWords = [];
            gridContainer.innerHTML = '';
            
            showNYTSummaryInHistory();
            enableRestartUI();
        }

        function triggerVictoryEnd() {
            showToast("CONGRATS!");
            showNYTSummaryInHistory();
            enableRestartUI();
        }

        function enableRestartUI() {
            btnSubmit.classList.add('hidden');
            btnDeselect.classList.add('hidden');
            btnShuffle.classList.add('hidden');
            btnRestart.classList.remove('hidden');
        }

        function recordGuessHistory(words, emojis, feedback) {
            guessHistory.push({ words, emojis, feedback });

            historyEmpty.classList.add('hidden');
            historyBadge.textContent = guessHistory.length;

            const item = document.createElement('div');
            item.className = "flex items-center justify-between text-xs sm:text-sm bg-gray-50 p-2 sm:p-2.5 rounded-lg border border-gray-100";
            
            const resultColorClass = feedback === "Correct!" ? "text-green-600" : feedback === "One away!" ? "text-amber-600" : "text-gray-500";

            item.innerHTML = `
                <div class="flex items-center space-x-2 overflow-hidden">
                    <span class="tracking-wider text-sm sm:text-base leading-none">${emojis.join('')}</span>
                    <span class="font-medium text-gray-800 truncate text-xs sm:text-sm">${words.join(', ')}</span>
                </div>
                <span class="font-bold text-xs ${resultColorClass} shrink-0 ml-2">${feedback}</span>
            `;

            historyLog.prepend(item);
        }

        function showNYTSummaryInHistory() {
            const summaryBox = document.createElement('div');
            summaryBox.className = "my-2 p-2.5 bg-stone-100 rounded-xl text-center border border-stone-200";
            
            let emojiMatrixHTML = guessHistory.map(g => g.emojis.join('')).join('<br>');
            
            summaryBox.innerHTML = `
                <div class="text-[10px] sm:text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Results Grid</div>
                <div class="text-base sm:text-lg tracking-widest leading-relaxed">${emojiMatrixHTML}</div>
            `;

            historyLog.prepend(summaryBox);
            historyDetails.open = true;
        }

        function updateMistakesUI() {
            mistakesDots.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const dot = document.createElement('div');
                dot.className = `w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full transition-all duration-300 ${
                    i < mistakesRemaining ? 'bg-gray-800' : 'bg-gray-200 scale-75'
                }`;
                mistakesDots.appendChild(dot);
            }
        }

        function showToast(text) {
            if (toastTimeout) clearTimeout(toastTimeout);
            
            toastEl.textContent = text;
            toastEl.classList.remove('hidden', 'scale-95', 'opacity-0');
            toastEl.classList.add('scale-100', 'opacity-100');

            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('scale-100', 'opacity-100');
                toastEl.classList.add('scale-95', 'opacity-0');
                setTimeout(() => toastEl.classList.add('hidden'), 200);
            }, 2000);
        }

        function triggerShakeAnimation() {
            gridContainer.classList.add('shake-animation');
            setTimeout(() => {
                gridContainer.classList.remove('shake-animation');
            }, 400);
        }

        // Event Listeners
        btnDeselect.onclick = () => {
            selectedIndices = [];
            renderGrid();
        };

        btnShuffle.onclick = () => {
            if (isGameOver) return;
            shuffleArray(activeWords);
            selectedIndices = [];
            renderGrid();
        };

        btnSubmit.onclick = handleSubmitGuess;
        btnRestart.onclick = initGame;

        // Initialize on load
        window.onload = initGame;
    </script>
</body>
</html>

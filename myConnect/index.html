<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connections Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #f9df6d;
            --green: #a0c35a;
            --blue: #b0c4ef;
            --purple: #ba81c5;
            --tile-bg: #efefe6;
            --tile-selected: #5a594e;
            --tile-text-selected: #ffffff;
            --text-primary: #1a1a1a;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #faf9f6;
            color: var(--text-primary);
        }

        .title-font {
            font-family: 'Frank Ruhl Libre', serif;
        }

        /* Tile pop and shift animations */
        @keyframes tilePop {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rowReveal {
            0% { transform: translateY(-10px) scale(0.98); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .tile-animate {
            animation: tilePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .row-reveal {
            animation: rowReveal 0.4s ease-out forwards;
        }

        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }

        /* Category banner themes */
        .bg-cat-yellow { background-color: var(--yellow); color: #2d2800; }
        .bg-cat-green { background-color: var(--green); color: #162900; }
        .bg-cat-blue { background-color: var(--blue); color: #081d42; }
        .bg-cat-purple { background-color: var(--purple); color: #2c0038; }

        /* Custom details arrow animation */
        details summary::-webkit-details-marker {
            display: none;
        }
        
        details summary svg.chevron {
            transition: transform 0.25s ease;
        }

        details[open] summary svg.chevron {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 select-none">

    <div class="w-full max-w-lg flex flex-col items-center my-auto">
        <!-- Header Section -->
        <header class="text-center mb-6">
            <h1 class="title-font text-3xl sm:text-4xl font-extrabold tracking-tight text-gray-900 mb-1">Connections</h1>
            <p id="sub-title" class="text-sm font-medium text-gray-600">Create four groups of four!</p>
        </header>

        <!-- Dynamic Feedback Message Toast -->
        <div id="toast-container" class="h-10 mb-4 flex items-center justify-center">
            <div id="toast" class="hidden px-4 py-2 bg-gray-900 text-white text-xs sm:text-sm font-semibold rounded-full shadow-lg transition-all duration-300 transform scale-95">
                Feedback text
            </div>
        </div>

        <!-- Solved Categories Container -->
        <div id="solved-container" class="w-full space-y-2 mb-2"></div>

        <!-- Interactive 4x4 Grid -->
        <div id="grid-container" class="w-full grid grid-cols-4 gap-2 sm:gap-2.5 mb-6">
            <!-- Tiles dynamically injected here -->
        </div>

        <!-- Mistakes Indicator -->
        <div id="mistakes-container" class="flex items-center justify-center space-x-2 mb-6">
            <span class="text-xs sm:text-sm font-medium text-gray-500">Mistakes remaining:</span>
            <div id="mistakes-dots" class="flex space-x-1.5">
                <div class="w-3 h-3 bg-gray-700 rounded-full transition-all duration-300"></div>
                <div class="w-3 h-3 bg-gray-700 rounded-full transition-all duration-300"></div>
                <div class="w-3 h-3 bg-gray-700 rounded-full transition-all duration-300"></div>
                <div class="w-3 h-3 bg-gray-700 rounded-full transition-all duration-300"></div>
            </div>
        </div>

        <!-- Control Action Buttons -->
        <div id="controls" class="flex flex-wrap items-center justify-center gap-2.5 mb-8 w-full">
            <button id="btn-shuffle" class="px-4 py-2.5 rounded-full border border-gray-900 text-gray-900 font-semibold text-xs sm:text-sm hover:bg-gray-100 active:scale-95 transition-all">
                Shuffle
            </button>
            <button id="btn-deselect" class="px-4 py-2.5 rounded-full border border-gray-900 text-gray-900 font-semibold text-xs sm:text-sm hover:bg-gray-100 active:scale-95 transition-all">
                Deselect All
            </button>
            <button id="btn-submit" disabled class="px-6 py-2.5 rounded-full border border-gray-900 bg-gray-900 text-white font-semibold text-xs sm:text-sm disabled:opacity-40 disabled:cursor-not-allowed hover:bg-black active:scale-95 transition-all">
                Submit
            </button>
            <button id="btn-restart" class="hidden px-6 py-2.5 rounded-full bg-black text-white font-semibold text-xs sm:text-sm hover:bg-gray-800 active:scale-95 transition-all">
                Play Again
            </button>
        </div>

        <!-- Collapsible Guess History Dropdown -->
        <details id="history-details" class="w-full border border-gray-200 rounded-2xl bg-white shadow-sm overflow-hidden transition-all duration-200">
            <summary class="flex items-center justify-between p-4 cursor-pointer hover:bg-gray-50 list-none font-semibold text-xs sm:text-sm text-gray-700">
                <span id="history-summary-text" class="flex items-center gap-2">
                    <span>Guess History</span>
                    <span id="history-badge" class="bg-gray-200 text-gray-700 text-xs px-2 py-0.5 rounded-full">0</span>
                </span>
                <svg class="chevron w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
                </svg>
            </summary>
            
            <div class="px-4 pb-4 pt-1 border-t border-gray-100 space-y-2.5 max-h-60 overflow-y-auto" id="history-log">
                <p id="history-empty" class="text-xs text-gray-400 italic text-center py-2">No guesses submitted yet.</p>
            </div>
        </details>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-gray-400">
        NYT Connections Clone • Editable Data Array
    </footer>

    <script>
        /**
         * GAME DATA STRUCTURE
         * Easily editable array of 4 distinct categories.
         * Difficulty maps directly to category color scheme:
         * 0 = Yellow (Easiest), 1 = Green, 2 = Blue, 3 = Purple (Hardest)
         */
    const categories = [
        { difficulty: 0, desc: "UNIT OF TIME", items: ["WEEK", "MONTH", "YEAR", "DECADE"] },
        { difficulty: 1, desc: "ORIGINAL STAR TREK CHARACTERS", items: ["SPOCK", "SCOTTY", "UHURA", "SULU"] },
        { difficulty: 2, desc: "FIRST WORD OF DISNEY CLASSICS", items: ["101", "HERBY", "SNOW", "SLEEPING"] },
        { difficulty: 3, desc: "STARTS WITH CRAZY", items: ["LADY", "HAPPY", "DAY", "BONES"] }
    ];

        // Color metadata mappings
        const DIFFICULTY_CLASSES = [
            'bg-cat-yellow',
            'bg-cat-green',
            'bg-cat-blue',
            'bg-cat-purple'
        ];
        
        const DIFFICULTY_EMOJIS = ['🟨', '🟩', '🟦', '🟪'];

        // Core Game State Variables
        let activeWords = [];       // Remaining unsolved word objects { text, categoryId }
        let selectedIndices = [];   // Currently highlighted word indices in activeWords
        let solvedCategories = [];  // Array of solved category IDs
        let guessHistory = [];      // Array of objects { words: [], colors: [], feedback: "" }
        let mistakesRemaining = 4;
        let isGameOver = false;
        let toastTimeout = null;

        // DOM Element References
        const gridContainer = document.getElementById('grid-container');
        const solvedContainer = document.getElementById('solved-container');
        const toastEl = document.getElementById('toast');
        const btnSubmit = document.getElementById('btn-submit');
        const btnDeselect = document.getElementById('btn-deselect');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnRestart = document.getElementById('btn-restart');
        const mistakesDots = document.getElementById('mistakes-dots');
        const historyLog = document.getElementById('history-log');
        const historyEmpty = document.getElementById('history-empty');
        const historyBadge = document.getElementById('history-badge');
        const historyDetails = document.getElementById('history-details');

        /**
         * Initializes or resets the game state
         */
        function initGame() {
            activeWords = [];
            selectedIndices = [];
            solvedCategories = [];
            guessHistory = [];
            mistakesRemaining = 4;
            isGameOver = false;

            // Populate active words array
            GAME_CATEGORIES.forEach((cat, index) => {
                cat.items.forEach(item => {
                    activeWords.push({
                        text: item.toUpperCase(),
                        categoryId: index
                    });
                });
            });

            // Randomize grid order
            shuffleArray(activeWords);

            // Clear DOM UI
            solvedContainer.innerHTML = '';
            historyLog.innerHTML = '';
            historyLog.appendChild(historyEmpty);
            historyEmpty.classList.remove('hidden');
            historyBadge.textContent = '0';
            historyDetails.open = false;

            btnSubmit.classList.remove('hidden');
            btnDeselect.classList.remove('hidden');
            btnShuffle.classList.remove('hidden');
            btnRestart.classList.add('hidden');
            btnSubmit.disabled = true;

            updateMistakesUI();
            renderGrid();
        }

        /**
         * Knuth Fisher-Yates array shuffle algorithm
         */
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /**
         * Renders current unsolved word tiles into grid
         */
        function renderGrid() {
            gridContainer.innerHTML = '';
            
            // Adjust grid row count dynamically based on remaining words
            const rows = activeWords.length / 4;
            gridContainer.className = `w-full grid grid-cols-4 gap-2 sm:gap-2.5 mb-6`;

            activeWords.forEach((wordObj, index) => {
                const tile = document.createElement('button');
                tile.type = 'button';
                
                const isSelected = selectedIndices.includes(index);
                
                // Base classes
                let tileClasses = "h-20 sm:h-24 rounded-xl flex items-center justify-center p-1.5 sm:p-2 text-center font-bold text-xs sm:text-sm tracking-tight leading-tight uppercase transition-all duration-150 tile-animate shadow-sm ";
                
                if (isSelected) {
                    tileClasses += "bg-[var(--tile-selected)] text-[var(--tile-text-selected)] transform scale-[0.98]";
                } else {
                    tileClasses += "bg-[var(--tile-bg)] text-[var(--text-primary)] hover:bg-stone-200 active:scale-95";
                }

                tile.className = tileClasses;
                tile.textContent = wordObj.text;
                tile.onclick = () => handleTileClick(index);

                gridContainer.appendChild(tile);
            });

            // Update Submit Button State
            btnSubmit.disabled = selectedIndices.length !== 4 || isGameOver;
        }

        /**
         * Toggles tile selection state
         */
        function handleTileClick(index) {
            if (isGameOver) return;

            const existingIndex = selectedIndices.indexOf(index);
            if (existingIndex > -1) {
                // Deselect
                selectedIndices.splice(existingIndex, 1);
            } else if (selectedIndices.length < 4) {
                // Select up to 4 tiles max
                selectedIndices.push(index);
            }

            renderGrid();
        }

        /**
         * Processes submitted selection guess
         */
        function handleSubmitGuess() {
            if (selectedIndices.length !== 4 || isGameOver) return;

            const selectedWords = selectedIndices.map(i => activeWords[i].text).sort();
            const guessKey = selectedWords.join('|');

            // 1. Check for Duplicate Guess
            const isDuplicate = guessHistory.some(g => [...g.words].sort().join('|') === guessKey);
            if (isDuplicate) {
                showToast("Already guessed!");
                triggerShakeAnimation();
                return;
            }

            // Group guess items by category ID
            const categoryCounts = {};
            selectedIndices.forEach(i => {
                const catId = activeWords[i].categoryId;
                categoryCounts[catId] = (categoryCounts[catId] || 0) + 1;
            });

            const counts = Object.values(categoryCounts);
            const maxMatch = Math.max(...counts);
            const matchingCategoryId = Object.keys(categoryCounts).find(catId => categoryCounts[catId] === 4);

            // Map visual emoji sequence matching user selection
            const guessColors = selectedIndices.map(i => DIFFICULTY_EMOJIS[activeWords[i].categoryId]);

            if (matchingCategoryId !== undefined) {
                // Correct Guess (4/4 matched)
                handleCorrectGuess(parseInt(matchingCategoryId), selectedWords, guessColors);
            } else {
                // Incorrect Guess
                handleIncorrectGuess(maxMatch, selectedWords, guessColors);
            }
        }

        /**
         * Handles successful category group guess
         */
        function handleCorrectGuess(catId, wordList, emojiColors) {
            solvedCategories.push(catId);
            
            // Log history
            recordGuessHistory(wordList, emojiColors, "Correct!");

            // Remove solved words from active pool
            const solvedCategoryItems = GAME_CATEGORIES[catId].items.map(item => item.toUpperCase());
            activeWords = activeWords.filter(w => !solvedCategoryItems.includes(w.text));
            selectedIndices = [];

            // Add Category Banner to top
            renderSolvedCategoryBanner(catId);
            
            if (solvedCategories.length === 4) {
                // Victory Condition
                isGameOver = true;
                showToast("Great job!");
                setTimeout(triggerVictoryEnd, 600);
            } else {
                showToast("Nice!");
            }

            renderGrid();
        }

        /**
         * Renders full-width banner for solved categories
         */
        function renderSolvedCategoryBanner(catId) {
            const category = GAME_CATEGORIES[catId];
            const banner = document.createElement('div');
            
            const colorClass = DIFFICULTY_CLASSES[category.difficulty];
            banner.className = `w-full rounded-xl p-4 text-center ${colorClass} row-reveal shadow-sm flex flex-col justify-center items-center`;
            
            banner.innerHTML = `
                <h2 class="font-extrabold text-sm sm:text-base tracking-wide uppercase mb-0.5">${category.desc}</h2>
                <p class="text-xs sm:text-sm font-medium tracking-tight opacity-90">${category.items.join(', ')}</p>
            `;
            
            solvedContainer.appendChild(banner);
        }

        /**
         * Handles incorrect guess outcomes and mistake tracking
         */
        function handleIncorrectGuess(maxMatch, wordList, emojiColors) {
            mistakesRemaining--;
            updateMistakesUI();

            let feedback = "Nope!";
            if (maxMatch === 3) {
                feedback = "One away!";
            }

            showToast(feedback);
            triggerShakeAnimation();
            recordGuessHistory(wordList, emojiColors, feedback);

            if (mistakesRemaining === 0) {
                // Defeat Condition
                isGameOver = true;
                setTimeout(triggerDefeatEnd, 800);
            }
        }

        /**
         * Displays defeat state and reveals remaining categories
         */
        function triggerDefeatEnd() {
            showToast("Next time!");
            
            // Reveal remaining categories in order
            GAME_CATEGORIES.forEach((cat, index) => {
                if (!solvedCategories.includes(index)) {
                    renderSolvedCategoryBanner(index);
                }
            });

            activeWords = [];
            gridContainer.innerHTML = '';
            
            showNYTSummaryInHistory();
            enableRestartUI();
        }

        /**
         * Handles victory state end screen summary
         */
        function triggerVictoryEnd() {
            showToast("CONGRATS!");
            showNYTSummaryInHistory();
            enableRestartUI();
        }

        /**
         * Displays Play Again option after game completion
         */
        function enableRestartUI() {
            btnSubmit.classList.add('hidden');
            btnDeselect.classList.add('hidden');
            btnShuffle.classList.add('hidden');
            btnRestart.classList.remove('hidden');
        }

        /**
         * Adds submitted guess record to Collapsible History
         */
        function recordGuessHistory(words, emojis, feedback) {
            guessHistory.push({ words, emojis, feedback });

            historyEmpty.classList.add('hidden');
            historyBadge.textContent = guessHistory.length;

            const item = document.createElement('div');
            item.className = "flex items-center justify-between text-xs sm:text-sm bg-gray-50 p-2.5 rounded-lg border border-gray-100";
            
            const resultColorClass = feedback === "Correct!" ? "text-green-600" : feedback === "One away!" ? "text-amber-600" : "text-gray-500";

            item.innerHTML = `
                <div class="flex items-center space-x-2 overflow-hidden">
                    <span class="tracking-widest text-base leading-none">${emojis.join('')}</span>
                    <span class="font-medium text-gray-800 truncate">${words.join(', ')}</span>
                </div>
                <span class="font-bold text-xs ${resultColorClass} shrink-0 ml-2">${feedback}</span>
            `;

            historyLog.prepend(item);
        }

        /**
         * Appends NYT-style emoji matrix inside the collapsible history log
         */
        function showNYTSummaryInHistory() {
            const summaryBox = document.createElement('div');
            summaryBox.className = "my-3 p-3 bg-stone-100 rounded-xl text-center border border-stone-200";
            
            let emojiMatrixHTML = guessHistory.map(g => g.emojis.join('')).join('<br>');
            
            summaryBox.innerHTML = `
                <div class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Results Grid</div>
                <div class="text-xl tracking-widest leading-relaxed">${emojiMatrixHTML}</div>
            `;

            historyLog.prepend(summaryBox);
            // Open accordion to display final result summary
            historyDetails.open = true;
        }

        /**
         * Updates mistake indicator dot counts
         */
        function updateMistakesUI() {
            mistakesDots.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const dot = document.createElement('div');
                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${
                    i < mistakesRemaining ? 'bg-gray-800' : 'bg-gray-200 scale-75'
                }`;
                mistakesDots.appendChild(dot);
            }
        }

        /**
         * Displays short-lived toast message
         */
        function showToast(text) {
            if (toastTimeout) clearTimeout(toastTimeout);
            
            toastEl.textContent = text;
            toastEl.classList.remove('hidden', 'scale-95', 'opacity-0');
            toastEl.classList.add('scale-100', 'opacity-100');

            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('scale-100', 'opacity-100');
                toastEl.classList.add('scale-95', 'opacity-0');
                setTimeout(() => toastEl.classList.add('hidden'), 200);
            }, 2000);
        }

        /**
         * Applies shake animation on grid when guess is invalid or incorrect
         */
        function triggerShakeAnimation() {
            gridContainer.classList.add('shake-animation');
            setTimeout(() => {
                gridContainer.classList.remove('shake-animation');
            }, 400);
        }

        // Event Listeners
        btnDeselect.onclick = () => {
            selectedIndices = [];
            renderGrid();
        };

        btnShuffle.onclick = () => {
            if (isGameOver) return;
            shuffleArray(activeWords);
            selectedIndices = [];
            renderGrid();
        };

        btnSubmit.onclick = handleSubmitGuess;
        btnRestart.onclick = initGame;

        // Launch Game on Page Load
        window.onload = initGame;
    </script>
</body>
</html>
